[package]
name = "clockit-applet"
version = "0.2.0"
description = "Native COSMIC panel applet for Clockit"
license = "MIT"
edition = "2024"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "03c8f93b294ad239ea935f6dd3c14a15acde8d0d", default-features = false, features = ["applet", "dbus-config"] }
tokio = { version = "1", features = ["time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
